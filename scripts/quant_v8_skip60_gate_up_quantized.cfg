skip_layers : "/model/layers.8/self_attn/MatMul_1"
skip_layers : "/model/layers.9/self_attn/MatMul_1"
skip_layers : "/model/layers.10/self_attn/MatMul_1"
skip_layers : "/model/layers.11/self_attn/MatMul_1"
skip_layers : "/model/layers.12/self_attn/MatMul_1"
