skip_layers : "/model/layers.26/self_attn/MatMul_1"
skip_layers : "/model/layers.27/self_attn/MatMul_1"

# 4. outlier down_proj (3层): 激活存在极端离群值
#    Layer 2: abs_max=3085, p99.99=11.1, 离群比=278x
#    Layer 26: abs_max=1225, p99.99=106, 离群比=11.5x
#    Layer 27: abs_max=474, p99.99=232, 离群比=2.0x
skip_layers : "/model/layers.2/mlp/down_proj/MatMul"
skip_layers : "/model/layers.26/mlp/down_proj/MatMul"
skip_layers : "/model/layers.27/mlp/down_proj/MatMul"

# NOTE: /model/layers.X/mlp/MatMul (gate_up_fuse) 不再 skip
# 该 MatMul = F.linear(x, concat(gate_w, up_w))，一端是 activation，一端是 weight
# 不是 activation×activation，适合 W8A8 量化

common_config : {
    arq_quantize : {
        channel_wise : false
    }
    ifmr_quantize : {
        search_range_start : 0.7
        search_range_end : 1.3
        search_step : 0.01
        max_percentile : 0.999999
        min_percentile : 0.999999
    }
}
