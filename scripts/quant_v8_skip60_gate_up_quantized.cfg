skip_layers : "/model/layers.15/self_attn/MatMul"
skip_layers : "/model/layers.16/self_attn/MatMul"
skip_layers : "/model/layers.17/self_attn/MatMul"
skip_layers : "/model/layers.18/self_attn/MatMul"
skip_layers : "/model/layers.19/self_attn/MatMul"
skip_layers : "/model/layers.20/self_attn/MatMul"
skip_layers : "/model/layers.21/self_attn/MatMul"
skip_layers : "/model/layers.22/self_attn/MatMul"
skip_layers : "/model/layers.23/self_attn/MatMul"
skip_layers : "/model/layers.24/self_attn/MatMul"
skip_layers : "/model/layers.25/self_attn/MatMul"
skip_layers : "/model/layers.26/self_attn/MatMul"
skip_layers : "/model/layers.27/self_attn/MatMul"

# 3. Attention Score*V (28层): attn_score*V，两端都是激活
skip_layers : "/model/layers.0/self_attn/MatMul_1"
skip_layers : "/model/layers.1/self_attn/MatMul_1"
skip_layers : "/model/layers.2/self_attn/MatMul_1"
skip_layers : "/model/layers.3/self_attn/MatMul_1"
