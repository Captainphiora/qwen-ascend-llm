# v8_skip60: 基于 v7_skip88，移除 28 个 gate_up_fuse 的 skip
# gate_up_fuse MatMul (/model/layers.X/mlp/MatMul) 实际是 activation × weight(Concat)
# 不是 activation × activation，应当被量化
#
# skip 统计:
#   1  lm_head
#  28  Attention QK^T (/self_attn/MatMul)
#  28  Attention Score*V (/self_attn/MatMul_1)
#   3  outlier down_proj (L2/26/27)
# = 60 skip, 165 quantized (vs v7: 88 skip, 137 quantized)

batch_num : 50
activation_offset : true

# 1. lm_head: 输出层，精度敏感
skip_layers : "/lm_head/MatMul"

# 2. Attention QK^T (28层): Q*K，两端都是激活
skip_layers : "/model/layers.0/self_attn/MatMul"
skip_layers : "/model/layers.1/self_attn/MatMul"
skip_layers : "/model/layers.2/self_attn/MatMul"
skip_layers : "/model/layers.3/self_attn/MatMul"
skip_layers : "/model/layers.4/self_attn/MatMul"
